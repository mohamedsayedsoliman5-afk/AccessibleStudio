name: Build AccessibleStudio Standalone Executable

on:
  push:
    branches: [ "main", "master" ]
    tags: [ "v*" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test:
    name: Run Automated Tests (Ubuntu)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Studio Test Suite
        run: |
          mkdir -p exports recordings
          python test_studio.py

  build-windows:
    name: Build Windows Standalone Package
    needs: test
    runs-on: windows-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Dependencies & PyInstaller
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Download Audio & Accessibility DLLs and SoundFont
        shell: pwsh
        run: |
          Write-Host "Downloading FluidSynth v2.6.1 Windows x64..."
          try {
              Invoke-WebRequest -Uri "https://github.com/FluidSynth/fluidsynth/releases/download/v2.6.1/fluidsynth-v2.6.1-win10-x64-cpp11.zip" -OutFile "fluidsynth.zip" -TimeoutSec 45
              Expand-Archive -Path "fluidsynth.zip" -DestinationPath "fluidsynth_temp"
              Get-ChildItem -Path "fluidsynth_temp" -Filter "*.dll" -Recurse | ForEach-Object { Copy-Item $_.FullName . -Force }
              Write-Host "FluidSynth DLLs unpacked successfully."
          } catch {
              Write-Host "Warning: FluidSynth download fallback: $_"
          }

          Write-Host "Extracting NVDA Controller Client DLLs from cytolk..."
          try {
              $cytolkDir = python -c "import cytolk, os; print(os.path.dirname(cytolk.__file__))"
              if (Test-Path "$cytolkDir\nvdaControllerClient64.dll") {
                  Copy-Item "$cytolkDir\nvdaControllerClient64.dll" . -Force
                  Write-Host "nvdaControllerClient64.dll copied."
              }
              if (Test-Path "$cytolkDir\SAAPI64.dll") {
                  Copy-Item "$cytolkDir\SAAPI64.dll" . -Force
                  Write-Host "SAAPI64.dll copied."
              }
          } catch {
              Write-Host "Warning: cytolk DLL copy fallback: $_"
          }

          Write-Host "Downloading General MIDI SoundFont (default.sf2)..."
          try {
              Invoke-WebRequest -Uri "https://raw.githubusercontent.com/wrightflyer/SF2_SoundFonts/master/GeneralUser%20GS%20v1.471.sf2" -OutFile "default.sf2" -TimeoutSec 60
              Write-Host "SoundFont default.sf2 downloaded successfully."
          } catch {
              Write-Host "Warning: SoundFont download fallback: $_"
          }

          Get-ChildItem -Filter "*.dll" | Select-Object Name

      - name: Compile Executable via PyInstaller
        shell: pwsh
        run: |
          pyinstaller --noconfirm --onedir --windowed `
            --name "AccessibleStudio" `
            --collect-all "pygame" `
            --collect-all "numpy" `
            --collect-all "mido" `
            --collect-all "pyttsx3" `
            --collect-all "comtypes" `
            --collect-all "cytolk" `
            --hidden-import "speech_engine" `
            --hidden-import "synth_engine" `
            --hidden-import "keyboard_mapper" `
            --hidden-import "note_editor" `
            --hidden-import "sequencer" `
            --hidden-import "step_sequencer" `
            --hidden-import "exporter" `
            --hidden-import "ui_renderer" `
            --hidden-import "config" `
            --hidden-import "win32com.client" `
            --hidden-import "comtypes.client" `
            --hidden-import "fluidsynth" `
            main.py

      - name: Package Portable ZIP Distribution
        shell: bash
        run: |
          cp -f *.dll dist/AccessibleStudio/ 2>/dev/null || true
          cp -f default.sf2 dist/AccessibleStudio/ 2>/dev/null || true
          cp -f README.md dist/AccessibleStudio/
          cp -f run_debug.bat dist/AccessibleStudio/
          mkdir -p dist/AccessibleStudio/exports
          mkdir -p dist/AccessibleStudio/recordings
          cd dist
          7z a -tzip AccessibleStudio-Windows-x64.zip AccessibleStudio/

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: AccessibleStudio-Windows-x64
          path: dist/AccessibleStudio-Windows-x64.zip
          retention-days: 30

      - name: Create GitHub Release (On Tag)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/AccessibleStudio-Windows-x64.zip
          draft: false
          prerelease: false
          generate_release_notes: true
